<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    # .htaccess di root project khusus hosting (handler LiteSpeed "x-lsphp81"):
    # jangan dibaca di Docker, kalau terbaca file .php tampil sebagai teks.
    <Directory /var/www/html>
        AllowOverride None
    </Directory>

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
