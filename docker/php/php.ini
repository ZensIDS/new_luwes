; Pengaturan PHP untuk container Luwes
date.timezone = Asia/Jakarta
memory_limit = 512M
upload_max_filesize = 20M
post_max_size = 25M
max_execution_time = 300
max_input_vars = 5000
expose_php = Off

; Kode ada di dalam image, jadi tidak perlu cek perubahan file (lebih cepat).
; Setelah update kode, jalankan: make update
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
