# Luwes — PC server lokal (offline) dengan Docker.
#
#   make up        -> pertama kali: buat .env, build image, jalankan semua service
#   make help      -> daftar perintah lain
#
# Service:
#   app        : web Laravel (Apache + PHP 8.2), dibuka PC client di http://IP-SERVER
#   scheduler  : cron Laravel (php artisan schedule:work) -> sinkron DB ke hosting tiap DB_SYNC_INTERVAL menit
#   mysql      : database lokal (MySQL 8)
#   phpmyadmin : opsional, hanya jalan dengan "make pma" (port 8080)
#
# Konfigurasi dibaca dari file .env (dibuat dari .env.docker.example oleh "make init").
# (Docker Compose untuk development Laravel Sail ada di docker-compose.sail.yml.)

name: luwes

x-app: &app
  image: luwes-app:latest
  restart: unless-stopped
  environment:
    TZ: Asia/Jakarta
  volumes:
    - ./.env:/var/www/html/.env:z
    - storage:/var/www/html/storage
  depends_on:
    mysql:
      condition: service_healthy

services:
  app:
    <<: *app
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      TZ: Asia/Jakarta
      CONTAINER_ROLE: app
    ports:
      - "${APP_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/login"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3

  scheduler:
    <<: *app
    # Memakai image hasil build service app (tidak build dua kali -> hemat disk & waktu).
    pull_policy: never
    environment:
      TZ: Asia/Jakarta
      CONTAINER_ROLE: scheduler
    depends_on:
      app:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+07:00
    environment:
      TZ: Asia/Jakarta
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?isi DB_ROOT_PASSWORD di .env (jalankan make init)}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:5
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      UPLOAD_LIMIT: 256M
    ports:
      - "${PMA_PORT:-8080}:80"
    depends_on:
      - mysql

volumes:
  mysql:
  storage:
